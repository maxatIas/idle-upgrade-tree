<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>idle-upgrade-tree</title>
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    <div class="header">
        <div class="gem-display">
            Gems: <span class="gem-amount">0</span>
        </div>
        <div class="utils">
            <button class="util-button" onclick="save()">Save</button>
            <button class="util-button" onclick="load()">Load</button>
            <button class="util-button dev-button" onclick="addDevCurrency()">+Dev Currency</button>
        </div>
    </div>
    <div class="middle">
        <div class="sidebar">
            <div class="page-tabs">
                <button class="tab-button active" data-page="upgrade">Upgrade</button>
                <button class="tab-button" data-page="summon">Summon</button>
            </div>
        </div>
        <div class="page-content">
            <div class="page-container">
                <div class="page upgrade-page">
                    <div class="coin-section">
                        <h3>Gold<br> <span class="CoinAmount GoldSTR">0</span></h3>
                        <div class="coin-img-container">
                        <img 
                            id="Coin" 
                            src="Gold.png" 
                            alt="" srcset="" 
                            draggable="false">
                        </div>
                    </div>
                    <div class="upgrades-section">
                        <div class="select-menu">
                            <div class="menu-types click-select">Clicker</div>
                            <div class="menu-types passive-select">Passive</div>
                            <div class="menu-types mult-select">Multiplier</div>
                            <div class="menu-types synergy-select">Synergy</div>
                        </div>
                        <div class="upgrade-container">
                            <div class="scroller">
                                <template id="template-normal-upgrade">
                                    <div class="upgrade">
                                        <div class="left-section">
                                            <button class="upgrade-button buy1">buy 1</button>
                                            <button class="upgrade-button buy10">buy 10</button>
                                            <button class="upgrade-button buyMax">buy max</button>
                                        </div>

                                        <div class="mid-section">
                                            <h4 class="upgrade-name"></h4>
                                            <div class="cost-info">
                                                <p>cost: <span class="upgrade-cost"></span></p>
                                                <img src="Gold.png">
                                            </div>
                                        </div>

                                        <div class="right-section">
                                            level <span class="upgrade-level">0</span>
                                        </div>

                                        <div class="level-info">
                                            <p>+<span class="level-increase"></span></p>
                                        </div>
                                    </div>
                                </template>
                                <template id="template-mult-upgrade">
                                    <div class="upgrade">
                                        <div class="left-section">
                                            <button class="upgrade-button buy">buy</button>
                                        </div>

                                        <div class="mid-section">
                                            <h4 class="upgrade-name"></h4>
                                            <div class="cost-info">
                                                <p>cost: <span class="upgrade-cost"></span></p>
                                                <img src="Gold.png">
                                            </div>
                                        </div>

                                        <div class="right-section">
                                            <span class="status">not owned</span>
                                        </div>

                                        <div class="level-info">
                                            <p></p>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <div class="prestige-container">
                            <button class="prestige-button" onclick="prestige()">Prestige</button>
                            <p class="prestige-description"></p>
                        </div>
                    </div>
                </div>
                <div class="page summon-page" style="display: none;">
                    <div class="summon-content">
                        <button class="summon-button" onclick="summonOnce()">Summon Once (1 gem)</button>
                        <button class="summon-button" onclick="summon10()">Summon x10 (10 gems)</button>
                    </div>
                    <div class="inventory-section">
                        <h4>Inventory</h4>
                        <div class="inventory-grid" id="inventory-grid">
                            <!-- Items will be added here by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <div class="stats">
            <p>+<span class="clicker-amount">1</span> gold per click</p>
            <p>+<span class="gps">0</span> gold per second</p>
            <p class="prestige-info">Prestige: <span class="current-prestige">None</span></p>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
